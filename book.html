<title>The Bad Mascots Card Show - Read the Book</title>
<style>
html,body{margin:0;height:100%;background:#f4f3ef;color:#222;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#book{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
.bar{width:100%;max-width:900px;display:flex;gap:16px;align-items:center;padding:10px 16px;box-sizing:border-box;font-size:16px}
.bar a{color:#14235c;font-weight:700}.bar span{margin-left:auto;color:#444}
.page{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px;box-sizing:border-box;width:100%}
.page img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 2px 12px rgba(0,0,0,.25);background:#fff;touch-action:pan-y;user-select:none}
.nav{display:flex;gap:12px;padding:10px 16px 14px}
.nav button{min-width:130px;padding:12px 18px;font-size:16px;font-weight:700;border-radius:10px;border:2px solid #14235c;cursor:pointer}
#next{background:#14235c;color:#fff}#back{background:#fff;color:#14235c}.nav button:disabled{opacity:.4;cursor:default}
</style></head><body>
<div id="book">
  <div class="bar"><a href="index.html">Back to Bad Mascots</a><a href="adventure.html">Adventure Game</a><span id="num"></span></div>
  <div class="page"><img id="img" alt="Book page"></div>
  <div class="nav"><button id="back">Back</button><button id="next">Next</button></div>
</div>
<script>
const N=25, src=i=>"book/bp-"+String(i+1).padStart(2,"0")+".webp", $=s=>document.querySelector(s);
let i=0; try{i=+localStorage.getItem("bmbook_page")||0}catch(e){}
function go(k){ i=Math.max(0,Math.min(N-1,k)); $("#img").src=src(i); $("#num").textContent="Page "+(i+1)+" of "+N;
  $("#back").disabled=i===0; $("#next").disabled=i===N-1; [i+1,i+2].forEach(j=>{if(j<N){const m=new Image();m.src=src(j)}});
  try{localStorage.setItem("bmbook_page",String(i))}catch(e){} }
$("#back").onclick=()=>go(i-1); $("#next").onclick=()=>go(i+1);
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(i+1)} else if(e.key==="ArrowLeft"){e.preventDefault();go(i-1)} });
let x0=null; const im=$("#img"); im.addEventListener("pointerdown",e=>{x0=e.clientX}); im.addEventListener("dragstart",e=>e.preventDefault());
im.addEventListener("pointerup",e=>{ if(x0==null)return; const dx=e.clientX-x0; x0=null; if(dx<-40)go(i+1); else if(dx>40)go(i-1); else go(i+(e.offsetX>im.clientWidth/2?1:-1)) });
const qid=new URLSearchParams(location.search).get("id");
if(qid){ document.querySelectorAll(".bar a").forEach(l=>l.href=l.getAttribute("href")+"?id="+encodeURIComponent(qid)); }
go(i);
</script></body></html>
